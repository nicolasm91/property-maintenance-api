name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs of the same PR or branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # postinstall runs `prisma generate`, which needs no database.
      - run: pnpm install --frozen-lockfile

      # Also enforces the hexagonal layer boundaries (see .oxlintrc.json).
      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
